<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="일상을 더 가볍게 만드는 ELEC Apps의 공식 홈페이지입니다.">
  <meta name="theme-color" content="#f4f1ea">
  <title>ELEC Apps</title>
  <link rel="stylesheet" href="/assets/style.css">

<body>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="ELEC Apps 홈">ELEC <span>Apps</span></a>
    <a class="header-link" href="mailto:elecappstore@gmail.com">문의하기</a>

  <main>
    <section class="hero">
      <p class="eyebrow">SMALL TOOLS, BETTER DAYS</p>

    </section>

    <section class="apps" aria-labelledby="apps-title">

        <h2 id="apps-title">만나보세요</h2>

      <article class="app-card">
        <div class="app-logo">
          <img src="/naeyong/png/icon_dark.png" alt="나에용 앱 아이콘">

        </div>
        <nav class="card-actions" aria-label="나에용 관련 링크">
          <a href="/naeyong/privacy/">개인정보 처리방침 <span aria-hidden="true">↗</span></a>
          <a href="/naeyong/support/">고객지원 <span aria-hidden="true">↗</span></a>
        </nav>
      </article>
    </section>
  </main>

  <footer>
    <p>© 2026 ELEC Apps</p>
    <a href="mailto:elecappstore@gmail.com">elecappstore@gmail.com</a>
  </footer>
